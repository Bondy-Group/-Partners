<!doctype html>
<html lang="es-PE">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>+Partners × Credicorp · Dashboard</title>
  <meta name="description" content="Panel interno +Partners para el engagement con Credicorp. Uso interno del equipo." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%231B2A4A'/%3E%3Ctext x='12' y='17' text-anchor='middle' font-family='Inter,sans-serif' font-weight='800' font-size='14' fill='%23fff'%3E%2B%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="assets/colors_and_type.css" />
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #F8FAFC; overflow: hidden; }
    #root { height: 100vh; width: 100vw; }
    body {
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      color: #0F1419;
    }
    /* Splash while Babel transpiles */
    .boot {
      position: fixed; inset: 0; display: flex; align-items: center;
      justify-content: center; flex-direction: column; gap: 12px;
      background: #F8FAFC; color: #94A3B8; font-size: 12px;
      letter-spacing: 0.6px; text-transform: uppercase; font-weight: 600;
      transition: opacity .25s ease-out;
    }
    .boot__dot {
      width: 6px; height: 6px; border-radius: 50%; background: #C832A0;
      animation: boot-pulse 1.1s ease-in-out infinite;
    }
    @keyframes boot-pulse {
      0%, 100% { opacity: 0.3; transform: scale(0.9); }
      50%      { opacity: 1;   transform: scale(1.1); }
    }
    .boot--gone { opacity: 0; pointer-events: none; }
  </style>
</head>
<body>
  <div id="root"></div>
  <div id="boot" class="boot">
    <span class="boot__dot"></span>
    <span>+Partners · Cargando</span>
  </div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

  <!-- Shared layer -->
  <script type="text/babel" src="shared/data.jsx"></script>
  <script type="text/babel" src="shared/tweaks-ctx.jsx"></script>
  <script type="text/babel" src="shared/components.jsx"></script>
  <script type="text/babel" src="shared/datasource.jsx"></script>

  <!-- v2 dashboard -->
  <script type="text/babel" src="v2/animations.jsx"></script>
  <script type="text/babel" src="v2/detail-data.jsx"></script>
  <script type="text/babel" src="v2/iniciativas-view.jsx"></script>
  <script type="text/babel" src="v2/detail-view.jsx"></script>
  <script type="text/babel" src="v2/atrevida-v2.jsx"></script>

  <!-- App entry -->
  <script type="text/babel" src="app.jsx"></script>

  <script>
    // Hide splash once React has rendered something into #root.
    (function hideBootWhenReady() {
      var boot = document.getElementById('boot');
      var root = document.getElementById('root');
      if (!boot || !root) return;
      var tries = 0;
      var timer = setInterval(function () {
        tries++;
        if (root.childElementCount > 0) {
          boot.classList.add('boot--gone');
          clearInterval(timer);
          setTimeout(function () { boot.remove(); }, 300);
        } else if (tries > 80) {
          // 8s ceiling — give up so the user sees something even if Babel fails
          clearInterval(timer);
        }
      }, 100);
    })();
  </script>
</body>
</html>
